name: Build Windows EXE

# Настройка триггеров: когда запускать сборку?
on:
  push:
    branches: [ "main", "dev" ] # Собирать при каждом пуше в main или dev
  workflow_dispatch:            # Позволяет запускать сборку вручную кнопкой в UI GitHub

jobs:
  build:
    runs-on: windows-latest # Выделяем чистую виртуальную машину с Windows

    steps:
    # Шаг 1: Скачиваем код репозитория на виртуальную машину
    - name: Checkout repository
      uses: actions/checkout@v4

    # Шаг 2: Устанавливаем Python нужной версии
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Кэширование пакетов для ускорения повторных сборок

    # Шаг 3: Устанавливаем зависимости проекта и PyInstaller
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # Шаг 4: Компиляция через PyInstaller
    # --onefile - собирает все в один exe
    # --noconsole - прячет черное окно консоли при запуске (для GUI приложений)
    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --noconsole --onefile --collect-all customtkinter --add-data "assets;assets" main.py

    # Шаг 5: Сохраняем готовый .exe файл в артефакты GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: laser-calculator-windows-exe # Имя архива для скачивания
        path: |
          dist/main.exe
          machines_config.json
          assets/